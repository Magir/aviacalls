name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode   # зависимости требуют Swift 6.2+, у runner по умолчанию старее
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - name: Test
        run: swift test
      - name: App bundle
        run: make app
