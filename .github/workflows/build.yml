name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode   # зависимости требуют Swift 6.2+, у runner по умолчанию старее
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - name: Test
        run: swift test
      - name: Signing certificate   # секретов нет в PR из форков — там сборка ad-hoc
        if: github.event_name == 'push'
        env:
          SIGN_CERT_P12: ${{ secrets.SIGN_CERT_P12 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: scripts/ci-keychain.sh
      - name: App bundle
        run: make app SIGN="${{ github.event_name == 'push' && 'AviaCalls Signing' || '-' }}"
